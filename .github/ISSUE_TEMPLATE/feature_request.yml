name: Feature request / 功能建议
description: Describe a concrete use case / 描述实际使用场景
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 问题或场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / 当前替代方法
