name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run demo
      - run: npm run test:install
      - name: Build verified release assets
        run: |
          node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw Error('Tag/package version mismatch')"
          mkdir release-package
          npm pack --pack-destination release-package
          cd release-package
          sha256sum cloonex-*.tgz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-package/* --verify-tag --prerelease --title "$GITHUB_REF_NAME — local project memory via MCP" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
